[project]
name = "control-plane"
version = "0.1.0"
description = "Zero-trust AI & MCP control plane: STDIO MCP server, MCP gateway, streaming PII guardrail, failover router."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27,<2",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic>=2.7",
    "pydantic-settings",
    "aiosqlite",
    "pyjwt",
    "anyio",
    "rich",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "slow: long-running tests (multi-process, large streams)",
    "subprocess: tests that spawn a child process",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "prompts", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["aiosqlite.*"]
ignore_missing_imports = true
